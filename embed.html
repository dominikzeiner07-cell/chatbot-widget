<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Widget Embed</title>

  <!-- Cache-busted CSS wird per Script gesetzt -->
  <link id="cw-style" rel="stylesheet" href="./style.css" />

  <style>
    /* iframe soll wirklich transparent bleiben */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
    }

    /* style.css setzt body auf min-height:100vh + weiß; im iframe überschreiben */
    body {
      min-height: 0 !important;
      background: transparent !important;
    }

    /* ---------- Avatar Größen ---------- */
    .cw-header-avatar {
      width: 40px !important;
      height: 40px !important;
      min-width: 40px !important;
      border-radius: 999px !important;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cw-avatar {
      width: 30px !important;
      height: 30px !important;
      min-width: 30px !important;
      border-radius: 999px !important;
      overflow: hidden;
    }

    .cw-header-avatar img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 999px;
      object-fit: cover;
    }

    .cw-avatar-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      font-size: 16px;
    }

    .cw-avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Backdrop (nur aktiv, wenn Chat offen + Mobile) -->
  <div id="cw-backdrop" class="cw-backdrop cw-hidden" aria-hidden="true"></div>

  <!-- Chat-Launcher -->
  <div id="cw-launcher-wrap">
    <div id="cw-greeting" class="cw-greeting">
      <span class="cw-greeting-text">Ich bin hier, falls du Hilfe benötigst!</span>
      <button class="cw-greeting-close" type="button" aria-label="Begrüßung schließen">×</button>
    </div>

    <button id="cw-launcher" type="button" aria-label="Chat öffnen">
      <span class="cw-launcher-icon">💬</span>
    </button>
  </div>

  <!-- Chat Window -->
  <aside id="cw-window" class="cw-window cw-hidden" role="dialog" aria-label="Support-Chat">
    <header class="cw-header">
      <div class="cw-header-left">
        <div class="cw-header-avatar" aria-label="Bot Avatar">
          <img id="cw-avatar-img" alt="Bot Avatar" style="display:none;" />
          <div id="cw-avatar-fallback" class="cw-avatar-fallback" aria-hidden="true">◉</div>
        </div>

        <div class="cw-header-texts">
          <div class="cw-header-title">Ich helfe dir gerne!</div>
          <div class="cw-header-subline">
            <span class="cw-header-status">Online</span>
            <span class="cw-header-separator">–</span>
            <span class="cw-header-brand">powered by Zeiner-Systems</span>
          </div>
        </div>
      </div>

      <button class="cw-close" id="cw-close" type="button" aria-label="Fenster schließen">×</button>
    </header>

    <main class="cw-body" id="cw-body" aria-live="polite"></main>

    <form class="cw-composer" id="cw-form">
      <textarea
        id="cw-input"
        class="cw-input"
        maxlength="1000"
        autocomplete="off"
        placeholder="Schreib eine Nachricht…"
        aria-label="Nachricht eingeben"
        rows="1"
      ></textarea>
      <button id="cw-send" class="cw-send" type="submit" aria-label="Senden">
        <span class="cw-send-arrow">➤</span>
      </button>
    </form>
  </aside>

  <script>
    // Query Params
    var sp = new URLSearchParams(location.search);

    // Expose config to script.js
    window.CHATBOT_WIDGET_KEY = sp.get("widget_key") || "";
    window.CHATBOT_API_BASE = sp.get("api_base") || "";

    // Greeting-Gating (vom Loader widget.js gesetzt): nur Startseite, 1x/Session.
    // Fehlt der Param (alter gecachter Loader), Default = true -> bisheriges Verhalten.
    var cwGreetingParam = sp.get("greeting");
    window.CW_ALLOW_GREETING = (cwGreetingParam === null) ? true : (cwGreetingParam === "1");

    // Cache bust (kommt aus widget.js als cb=v6)
    var cb = sp.get("cb") || "";

    // Cache-bust CSS
    try {
      var css = document.getElementById("cw-style");
      if (css && cb) css.href = "./style.css?cb=" + encodeURIComponent(cb);
    } catch (_) {}

    // Cache-bust JS (wichtig, sonst hängt der Browser oft an alter script.js!)
    (function loadScript() {
      var s = document.createElement("script");
      s.src = "./script.js" + (cb ? ("?cb=" + encodeURIComponent(cb)) : "");
      s.defer = true;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
